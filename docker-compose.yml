services:
  typer99:
    container_name: typer99
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SOCKET_URL=https://typer99-api.mewo.gay
    ports:
      - "3003:3003"  # Frontend
      - "3004:3004"  # Backend socket server
    labels:
      # Common Traefik configuration
      - "traefik.enable=true"
      
      # Frontend routing
      - "traefik.http.routers.typer99-frontend.rule=Host(`typer99.mewo.gay`)"
      - "traefik.http.routers.typer99-frontend.entrypoints=websecure"
      - "traefik.http.routers.typer99-frontend.tls=true"
      - "traefik.http.routers.typer99-frontend.tls.certresolver=default"
      - "traefik.http.routers.typer99-frontend.service=typer99-frontend-service"
      - "traefik.http.services.typer99-frontend-service.loadbalancer.server.port=3003"

      # Backend API routing
      - "traefik.http.routers.typer99-api.rule=Host(`typer99-api.mewo.gay`)"
      - "traefik.http.routers.typer99-api.entrypoints=websecure"
      - "traefik.http.routers.typer99-api.tls=true"
      - "traefik.http.routers.typer99-api.tls.certresolver=default"
      - "traefik.http.routers.typer99-api.service=typer99-api-service"
      - "traefik.http.services.typer99-api-service.loadbalancer.server.port=3004"
